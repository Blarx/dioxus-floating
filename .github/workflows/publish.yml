name: Publish to Crates.io

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-tag:
    name: Verify release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Match tag to crate version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          manifest = tomllib.loads(Path('Cargo.toml').read_text(encoding='utf-8'))
          expected = f"v{manifest['package']['version']}"
          actual = os.environ['RELEASE_TAG']
          if actual != expected:
              raise SystemExit(f'Release tag {actual!r} must match Cargo.toml: {expected!r}')
          PY

  checks:
    name: Release checks
    needs: verify-tag
    uses: ./.github/workflows/checks.yml

  publish:
    name: Publish
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore checked dependency resolution
        uses: actions/download-artifact@v8
        with:
          name: checked-cargo-lock

      - name: Publish to Crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked
